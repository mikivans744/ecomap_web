<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ECOMAP - Panel administrativo">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2e7d32">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ecomap_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ECOMAP Panel Administrativo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    #ecomap-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      background: #f4f7f2;
      color: #2e7d32;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #ecomap-loading h1,
    #ecomap-loading p {
      margin: 0;
    }

    #ecomap-loading h1 {
      font-size: 28px;
    }

    #ecomap-loading p {
      color: #4b5563;
      font-size: 15px;
    }

    .ecomap-spinner {
      width: 28px;
      height: 28px;
      margin-top: 8px;
      border: 3px solid #c8e6c9;
      border-top-color: #2e7d32;
      border-radius: 50%;
      animation: ecomap-spin 0.8s linear infinite;
    }

    @keyframes ecomap-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ecomap-spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>
  <main id="ecomap-loading" role="status" aria-live="polite">
    <h1>ECOMAP Web</h1>
    <p>Cargando panel administrativo...</p>
    <span class="ecomap-spinner" aria-hidden="true"></span>
  </main>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('ecomap-loading')?.remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
